services:
  siren:
    # Build from the local Dockerfile by default. To use the pre-built image
    # from Docker Hub instead, comment out `build` and uncomment `image`.
    build:
      context: .
    image: maraudermarauder/siren:1.0.0
    container_name: siren
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=production
      # Set TRUST_PROXY=1 (or the number of proxy hops) when running behind a
      # TLS reverse proxy. Keeps the session cookie 'secure' and the login
      # rate-limiter on real client IPs.
      - TRUST_PROXY=${TRUST_PROXY:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s