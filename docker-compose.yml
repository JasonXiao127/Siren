services:
  siren:
    # Self-contained service: copy this block and the `siren-data` volume below
    # into any Compose file. Pulls the image published to GitHub Container
    # Registry by GitHub Actions, so the repo does not need to be cloned:
    #   docker compose pull && docker compose up -d
    # If the GHCR package is private, run `docker login ghcr.io` first.
    # For a local source build, use docker-compose.build.yml (see README).
    # To pin a release, change :latest to a version tag, e.g. :1.1.5.
    image: ghcr.io/jasonxiao127/siren:latest
    container_name: siren
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - SIREN_DATA_DIR=/data
      # Trust the reverse-proxy hop count so rate-limit IPs and req.secure
      # (Secure cookies) are correct. Set to 1 behind Caddy/Nginx/Traefik,
      # leave 0 for direct exposure.
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Subpath mount (e.g. /siren) — must match the image's BASE_PATH build
      # arg. The published GHCR image is built for root (/), so leave this as
      # / for it. To serve under /siren, build locally with
      # docker-compose.build.yml and pass BASE_PATH=/siren to build and run.
      # Never set SIREN_TOKEN here (Electron-only; it would 403 every browser
      # /api call).
      - BASE_PATH=${BASE_PATH:-/}
    volumes:
      - siren-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||8080;const b=(process.env.BASE_PATH||'/').replace(/\\/+$/,'');fetch('http://localhost:'+p+b+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Copy this entry along with the siren service when pasting into another
  # Compose file.
  siren-data:
