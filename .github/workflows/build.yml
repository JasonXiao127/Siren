name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release needs write access; everything else stays read-only.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Electron's postinstall downloads the platform binary. (The local
      # `allowScripts` package.json field is a wrapper feature plain npm
      # ignores; scripts run by default here.)
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (unsigned)
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds; wire CSC_LINK / CSC_KEY_PASSWORD (macOS) or a
          # Windows code-signing cert here when certificates are available.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siren-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error

  release:
    # Manual workflow_dispatch runs build artifacts only — no release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Attach installers only — blockmaps are update-tooling noise without
      # an update server.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
          generate_release_notes: true

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Diagnostic: fail fast with a clear signal if the secrets don't resolve
      # (empty values / wrong names) instead of a generic docker login error.
      - name: Verify Docker Hub secrets present
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN resolve to empty — check repo secrets"
            exit 1
          fi
          echo "Both secrets resolve (lengths: user=${#DOCKERHUB_USERNAME}, token=${#DOCKERHUB_TOKEN})"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v* tag → pushes maraudermarauder/siren:<version> + :latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: maraudermarauder/siren
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
